  <title>Browser Extension Setup</title>

<body>
  <h1>Browser Extension Setup</h1>
  <p>Load the <code>browser_extension</code> folder as an unpacked extension in Chrome or Edge.</p>
  <ol>
    <li>Run <code>python demo_server.py</code>.</li>
    <li>Open Chrome/Edge extensions page.</li>
    <li>Enable Developer Mode.</li>
    <li>Choose "Load unpacked" and select the <code>browser_extension</code> folder.</li>
  </ol>
</body>
</html>
